name: CI and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lag-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s >/dev/null

  container:
    name: Build and smoke-test container
    needs:
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t lag-app:ci .

      - name: Start container
        run: docker run -d --name lag-app-ci -p 8080:8080 lag-app:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "container is ready"
              exit 0
            fi
            sleep 1
          done

          docker logs lag-app-ci
          exit 1

      - name: Smoke-test served app
        shell: bash
        run: |
          set -euo pipefail

          base=http://127.0.0.1:8080
          curl -fsS "$base/" | grep -F "Start randomized quiz" >/dev/null
          curl -fsS "$base/src/data/glossary.js" | grep -F "u2-r135" >/dev/null
          curl -fsSI "$base/" | grep -i '^Content-Security-Policy:' >/dev/null

      - name: Stop container
        if: always()
        run: docker rm -f lag-app-ci || true

  deploy:
    name: Publish image and update GitOps
    needs:
      - quality
      - container
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require GitOps repository token
        shell: bash
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [ -z "$CONFIG_REPO_TOKEN" ]; then
            echo "::error::Add CONFIG_REPO_TOKEN with Contents: read/write access to homelab-cicd-config."
            exit 1
          fi

      - name: Check out tested commit
        uses: actions/checkout@v6

      - name: Compute image coordinates
        id: image
        shell: bash
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/lag-app" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homelab-cicd-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Bootstrap lag-app GitOps files when absent
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p config/apps/lag-app config/argocd
          for file in deployment.yaml service.yaml ingressroute.yaml kustomization.yaml; do
            if [ ! -f "config/apps/lag-app/$file" ]; then
              cp "k8s/$file" "config/apps/lag-app/$file"
            fi
          done

          if [ ! -f config/argocd/lag-app.yaml ]; then
            cp k8s/lag-app.yaml config/argocd/lag-app.yaml
          fi

      - name: Install Kustomize
        shell: bash
        env:
          KUSTOMIZE_VERSION: v5.7.1
          KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
        run: |
          set -euo pipefail

          url="https://github.com/kubernetes-sigs/kustomize/releases/download"
          url="${url}/kustomize%2F${KUSTOMIZE_VERSION}"
          url="${url}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o kustomize.tar.gz "$url"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz

      - name: Update lag-app image tag
        working-directory: config/apps/lag-app
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Validate GitOps deployment
        working-directory: config/apps/lag-app
        run: kustomize build . >/dev/null

      - name: Commit and push GitOps update
        working-directory: config
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/lag-app argocd/lag-app.yaml

          if git diff --cached --quiet; then
            echo "GitOps is already up to date"
            exit 0
          fi

          git commit -m "deploy: lag-app ${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
